name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# OIDC 認証で ID トークンを取得するために必須の設定
permissions:
  id-token: write
  contents: read
  pull-requests: write  # PRにplan結果をコメント書き込みしたい場合に必要

jobs:
  terraform:
    name: "Terraform Automation"
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコードをチェックアウト
      - name: Checkout Code
        uses: actions/checkout@v4

    # OIDC トークンの sub の値をログに直接出力して確認するステップ
      - name: Debug OIDC Token Sub
        uses: actions/github-script@v7
        with:
          script: |
            const idToken = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(idToken.split('.')[1], 'base64').toString());
            console.log("==========================================");
            console.log("【実際の sub の値】:", payload.sub);
            console.log("==========================================");

      # 2. OIDC を使って AWS に認証ログイン
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::521554524404:role/github-actions-terraform-role
          aws-region: ap-northeast-1

      # 3. Terraform CLI のセットアップ
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. コードのフォーマットチェック
      - name: Terraform Format
        run: terraform fmt -check

      # 5. 初期化（S3 バックエンド等の接続）
      - name: Terraform Init
        run: terraform init

      # 6. 構文チェック
      - name: Terraform Validate
        run: terraform validate

      # 7. 変更内容の確認（PR時およびpush時に実行）
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color

      # 8. 【Phase 6の目玉】mainブランチへのマージ（push）時のみ terraform apply を実行！
      - name: Terraform destroy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform destroy -auto-approve