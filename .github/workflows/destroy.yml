name: "Terraform Manual Destroy"

# 手動実行（Run workflow ボタン）のみをトリガーにする設定だにゃ
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./02_app_infra

    steps:
      # 1. コードをチェックアウト
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. OIDC 経由で AWS ログイン
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::521554524404:role/github-actions-terraform-role
          aws-region: ap-northeast-1

      # 3. Terraform CLI のセットアップ
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. 初期化
      - name: Terraform Init
        run: terraform init

      # 5. リソースの削除実行
      - name: Terraform Destroy
        run: terraform destroy -auto-approve